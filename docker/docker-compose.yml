name: incidentagent

services:
  postgres:
    image: postgres:17
    container_name: incidentagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: incidentagent
      POSTGRES_USER: incidentagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in docker/.env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentagent -d incidentagent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
