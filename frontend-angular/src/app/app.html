<h1>IncidentAgent (Angular)</h1>

<button type="button" (click)="callApi()">Call API</button>

@if (hello(); as h) {
  <p><strong>Message:</strong> {{ h.message }}</p>
  <p><strong>Time (UTC):</strong> {{ h.timeUtc | date: 'yyyy-MM-dd HH:mm:ss' : 'UTC' }}</p>
}

@if (error(); as e) {
  <p class="error">Error: {{ e }}</p>
}
